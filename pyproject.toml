[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# ── Project metadata ──────────────────────────────────────────
[project]
name            = "ggtk"
version         = "1.0.0"
description     = "Grammar-driven NLP toolkit for the 7 official Zambian Bantu languages"
readme          = "README.md"
license         = "MIT"
license-files   = ["LICEN[CS]E*"]
requires-python = ">=3.11"

authors = [
  { name = "shuller Habeenzu",  email="beenzu7@gmail.com" },
]

keywords = [
  "NLP", "morphology", "Bantu", "Zambia",
  "chiTonga", "chiBemba", "chiNyanja", "Luvale", "Lunda", "Kaonde", "Silozi",
  "computational-linguistics", "FST",
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
]

# ── Runtime dependencies ──────────────────────────────────────
# Core library has only one required dependency.
# Optional extras are listed below.
dependencies = [
  "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/pypa/sampleproject"
Issues = "https://github.com/pypa/sampleproject/issues"





# ── Optional extras ───────────────────────────────────────────
[project.optional-dependencies]

# Web API server
web = [
  "flask>=3.0",
]

# Development and testing
dev = [
  "pytest>=7.0",
  "pytest-cov>=4.0",
  "mypy>=1.0",
  "ruff>=0.1",
]

# HFST integration (Phase 2)
# hfst binaries are installed system-wide (not via pip); this extra
# is a marker only — install hfst separately from https://hfst.github.io
hfst = []

# ── Entry points ──────────────────────────────────────────────
[project.scripts]
ggtk = "ggtk.cli.ggtk_cli:main"

# ── Package discovery ─────────────────────────────────────────
[tool.setuptools.packages.find]
where   = ["."]
include = ["ggtk*"]

# CRITICAL: grammar YAML files must be bundled in the wheel.
# Without this, grammars are absent from installed packages.
[tool.setuptools.package-data]
ggtk = [
  "languages/*.yaml",
]

# ── pytest ────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths     = ["tests"]
python_files  = ["test_*.py"]
python_classes= ["Test*"]
python_functions = ["test_*"]
addopts       = "-v --tb=short"

# ── mypy ──────────────────────────────────────────────────────
[tool.mypy]
python_version         = "3.11"
warn_return_any        = true
warn_unused_ignores    = true
ignore_missing_imports = true   # third-party stubs not always available

# ── ruff ──────────────────────────────────────────────────────
[tool.ruff]
target-version = "py311"
line-length    = 100
select         = ["E", "F", "W", "I", "N"]
ignore         = ["E501"]   # line-length is a guide, not a hard rule

# ── coverage ──────────────────────────────────────────────────
[tool.coverage.run]
source = ["ggtk"]
omit   = ["*/tests/*", "*/scripts/*"]

[tool.coverage.report]
show_missing   = true
fail_under     = 70

[tool.hatch.build.targets.wheel]
packages = ["ggtk"]